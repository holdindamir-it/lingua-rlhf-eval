[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lingua-rlhf-eval"
version = "0.1.0"
description = "Cross-lingual LLM response evaluation, code auditing, and preference ranking"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
lingua-eval = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]
